        - /usr/bin/env sh .sqa/script.peach_compassionate_penguin.sh
        container: qc.doc_crimson_anxious_leopard
      github.com/PalomoIFCA/private3 git:
        commands:
        - /usr/bin/env sh .sqa/script.lavender_impulsive_chipmunk.sh
        container: qc.doc_sapphire_mature_clownfish
