config:
  credentials:
  - id: https://github.com/PalomoIFCA/private3
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/PalomoIFCA/private3:
      branch: main
      credential_tmp: true
      credentials_id: https://github.com/PalomoIFCA/private3
      repo: https://github.com/PalomoIFCA/private3
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/PalomoIFCA/private3 git:
        commands:
        - /usr/bin/env sh .sqa/script.thunder_productive_giraffe.sh
        container: qc.acc_verdant_compassionate_orca
  QC.Doc:
    repos:
      github.com/PalomoIFCA/private3 find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.sage_fierce_panther.sh
        container: qc.doc_cinnabar_thoughtful_osprey
      github.com/PalomoIFCA/private3 git:
        commands:
        - /usr/bin/env sh .sqa/script.cardamom_perceptive_ibex.sh
        container: qc.doc_aqua_understanding_shark
  QC.Lic:
    repos:
      github.com/PalomoIFCA/private3 licensee:
        commands:
        - /usr/bin/env sh .sqa/script.flax_grateful_toad.sh
        container: qc.lic_taupe_reliable_badger
  QC.Sec:
    repos:
      github.com/PalomoIFCA/private3 bandit:
        commands:
        - /usr/bin/env sh .sqa/script.blush_frugal_groundhog.sh
        container: qc.sec_cerise_friendly_hydra
  QC.Sty:
    repos:
      github.com/PalomoIFCA/private3 flake8:
        commands:
        - /usr/bin/env sh .sqa/script.forest_understanding_jackal.sh
        container: qc.sty_alabaster_tenacious_rattlesnake
  QC.Uni:
    repos:
      github.com/PalomoIFCA/private3 pytest:
        commands:
        - /usr/bin/env sh .sqa/script.plum_graceful_baboon.sh
        container: qc.uni_thunder_delighted_hippopotamus
  QC.Ver:
    repos:
      github.com/PalomoIFCA/private3 get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.cadet_skeptical_moose.sh
        container: qc.ver_lemon_lucky_serval
timeout: 5400
