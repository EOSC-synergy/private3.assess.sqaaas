config:
  credentials:
  - id: https://github.com/PalomoIFCA/private3
    password_var: GIT_PASSWORD
    username_var: GIT_USER
  project_repos:
    github.com/EOSC-synergy/sqaaas-tooling:
      branch: fix/updatego
      repo: https://github.com/EOSC-synergy/sqaaas-tooling
    github.com/PalomoIFCA/private3:
      branch: main
      credential_tmp: true
      credentials_id: https://github.com/PalomoIFCA/private3
      repo: https://github.com/PalomoIFCA/private3
environment:
  JPL_DOCKERFORCEBUILD: enabled
  JPL_KEEPGOING: enabled
sqa_criteria:
  QC.Acc:
    repos:
      github.com/PalomoIFCA/private3 git:
        commands:
        - /usr/bin/env sh .sqa/script.polar_observant_jellyfish.sh
        container: qc.acc_grege_mature_axolotl
  QC.Doc:
    repos:
      github.com/PalomoIFCA/private3 find_doc_files.py:
        commands:
        - /usr/bin/env sh .sqa/script.marina_amiable_cockatoo.sh
        container: qc.doc_rosewater_daring_jaguar
      github.com/PalomoIFCA/private3 git:
        commands:
        - /usr/bin/env sh .sqa/script.arctic_brilliant_sphinx.sh
        container: qc.doc_flamingo_artistic_ibis
  QC.Lic:
    repos:
      github.com/PalomoIFCA/private3 licensee:
        commands:
        - /usr/bin/env sh .sqa/script.clove_balanced_chimpanzee.sh
        container: qc.lic_gray_bright_bison
  QC.Sec:
    repos:
      github.com/PalomoIFCA/private3 bandit:
        commands:
        - /usr/bin/env sh .sqa/script.espresso_spirited_chimpanzee.sh
        container: qc.sec_glacier_attentive_ocelot
  QC.Sty:
    repos:
      github.com/PalomoIFCA/private3 flake8:
        commands:
        - /usr/bin/env sh .sqa/script.mustard_innocent_stork.sh
        container: qc.sty_paprika_cranky_crow
  QC.Uni:
    repos:
      github.com/PalomoIFCA/private3 pytest:
        commands:
        - /usr/bin/env sh .sqa/script.coffee_resilient_viper.sh
        container: qc.uni_tide_adaptable_jaguar
  QC.Ver:
    repos:
      github.com/PalomoIFCA/private3 get_git_tags.py:
        commands:
        - /usr/bin/env sh .sqa/script.cosmos_kind_sphinx.sh
        container: qc.ver_green_nurturing_pangolin
timeout: 5400
